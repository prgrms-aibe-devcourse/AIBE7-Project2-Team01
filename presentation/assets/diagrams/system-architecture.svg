  <text x="175" y="374" text-anchor="middle" fill="#697386" font-family="Inter, Pretendard, sans-serif" font-size="18" font-weight="800">Domain Data</text>
  <text x="440" y="342" text-anchor="middle" fill="#ff5a4f" font-family="Inter, Pretendard, sans-serif" font-size="27" font-weight="950">pgvector</text>
  <text x="440" y="374" text-anchor="middle" fill="#697386" font-family="Inter, Pretendard, sans-serif" font-size="18" font-weight="800">Embedding Search</text>
