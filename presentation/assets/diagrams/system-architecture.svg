<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Knotty 시스템 아키텍처</title>
  <desc id="desc">Browser, Express Frontend, Spring Boot API와 PostgreSQL, pgvector, Redis, Supabase, Gemini 연결 구조</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7f4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#69372d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1400" height="520" fill="#fff8f6"/>
  <g filter="url(#shadow)">
    <rect x="70" y="58" width="300" height="116" rx="10" fill="url(#panel)" stroke="#f0dfda"/>
    <rect x="550" y="58" width="300" height="116" rx="10" fill="url(#panel)" stroke="#f0dfda"/>
    <rect x="1030" y="58" width="300" height="116" rx="10" fill="url(#panel)" stroke="#f0dfda"/>
  </g>
  <text x="220" y="116" text-anchor="middle" fill="#1f2329" font-family="Inter, Pretendard, sans-serif" font-size="34" font-weight="900">Browser</text>
  <text x="700" y="106" text-anchor="middle" fill="#1f2329" font-family="Inter, Pretendard, sans-serif" font-size="31" font-weight="900">Express Frontend</text>
  <text x="700" y="142" text-anchor="middle" fill="#697386" font-family="Inter, Pretendard, sans-serif" font-size="20" font-weight="800">Static + /api Proxy</text>
  <text x="1180" y="106" text-anchor="middle" fill="#1f2329" font-family="Inter, Pretendard, sans-serif" font-size="31" font-weight="900">Spring Boot API</text>
  <text x="1180" y="142" text-anchor="middle" fill="#697386" font-family="Inter, Pretendard, sans-serif" font-size="20" font-weight="800">Auth · Domain · AI</text>
  <path d="M380 116H532" stroke="#ff5a4f" stroke-width="6" stroke-linecap="round"/>
  <path d="M520 100l22 16-22 16" fill="none" stroke="#ff5a4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M860 116h152" stroke="#ff5a4f" stroke-width="6" stroke-linecap="round"/>
  <path d="M1000 100l22 16-22 16" fill="none" stroke="#ff5a4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1180 176v62" stroke="#ff5a4f" stroke-width="5" stroke-linecap="round"/>
  <path d="M220 240h960" stroke="#ff5a4f" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <g filter="url(#shadow)">
    <rect x="55" y="290" width="240" height="112" rx="10" fill="#ffffff" stroke="#f0dfda"/>
    <rect x="320" y="290" width="240" height="112" rx="10" fill="#ffffff" stroke="#f0dfda"/>
    <rect x="585" y="290" width="240" height="112" rx="10" fill="#ffffff" stroke="#f0dfda"/>
