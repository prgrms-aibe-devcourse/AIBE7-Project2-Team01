  <text x="1235" y="342" text-anchor="middle" fill="#ff5a4f" font-family="Inter, Pretendard, sans-serif" font-size="27" font-weight="950">Gemini</text>
  <text x="1235" y="374" text-anchor="middle" fill="#697386" font-family="Inter, Pretendard, sans-serif" font-size="18" font-weight="800">Generation / Reason</text>
